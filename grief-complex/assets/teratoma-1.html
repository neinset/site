<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teratoma (1) – TGC Asset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Lightbox overlay */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Enlarged image */
    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      box-shadow: 0 0 20px #000;
    }

    /* Close button */
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    /* Make thumbnails clickable */
    .photo-frame img {
      cursor: pointer;
    }

    body {
      background-color: #26E148;
      font-family: sans-serif;
      margin: 0;
    }

    header, nav {
      background-color: #ffffff33;
      padding: 0.5em 1em;
    }

    nav a {
      color: #0048FF;
      font-weight: bold;
      text-decoration: none;
    }

    main {
      padding: 1em;
    }

    .photos {
      column-count: 3;
      column-gap: 1em;
    }

    .photo-frame {
      /* border: 1px solid #0048FF; */
      padding: 0.5em;
      background-color: #ffffff33;
      box-sizing: border-box;
      break-inside: avoid;
      margin-bottom: 1em;
    }

    .photo-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <h1>Teratoma (1)</h1>
</header>

<nav>
  <a href="/grief-complex/assets.html">Back to Assets</a>
</nav>

<main>
  <div class="photos">

    <div class="photo-frame">
      <img src="/images/assets/teratomas/1.jpg" alt="Teratoma view 1" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/2.jpg" alt="Teratoma view 2" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/3.jpg" alt="Teratoma view 3" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/4.jpg" alt="Teratoma view 4" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/5.jpg" alt="Teratoma view 5" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/6.jpg" alt="Teratoma view 6" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/7.jpg" alt="Teratoma view 7" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/8.jpg" alt="Teratoma view 8" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/9.jpg" alt="Teratoma view 9" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/10.jpg" alt="Teratoma view 10" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/11.jpg" alt="Teratoma view 11" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/12.jpg" alt="Teratoma view 12" loading="lazy">
    </div>

    <div class="photo-frame">
      <img src="/images/assets/teratomas/13.jpg" alt="Teratoma view 13" loading="lazy">
    </div>

  </div>
</main>

<!-- Lightbox Overlay -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.querySelector('.lightbox-img');
  const closeBtn = document.querySelector('.lightbox-close');

  // Open lightbox when clicking a thumbnail
  document.querySelectorAll('.photo-frame img').forEach(img => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
    });
  });

  // Close on X click
  closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });

  // Close when clicking outside image
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = 'none';
    }
  });

  // Close with Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      lightbox.style.display = 'none';
    }
  });
</script>

</body>
</html>
